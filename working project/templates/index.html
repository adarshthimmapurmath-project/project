<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Search</title>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <h1>Video Search</h1>
    <form id="searchForm">
        <input type="text" id="keyword" name="keyword" placeholder="Enter keyword">
        <button type="submit">Search</button>
    </form>
    
    <div id="searchResults">
        <ul id="resultList"></ul>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var searchForm = document.getElementById('searchForm');
            var resultList = document.getElementById('resultList');
    
            searchForm.addEventListener('submit', function(event) {
                event.preventDefault();
                var keywordInput = document.getElementById('keyword');
                var keyword = keywordInput.value.trim(); // Trim whitespace
                if (!keyword) {
                    alert("Please enter a keyword.");
                    return;
                }
                fetch(`/search?keyword=${encodeURIComponent(keyword)}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        // Clear previous results
                        resultList.innerHTML = '';

                        // Assuming data is the object with file paths and timestamps
                        var filePath = 'C:/Users/91990/OneDrive/Desktop/Project/videos/v001.srt';
                        if (data[filePath] && Array.isArray(data[filePath])) {
                            data[filePath].forEach(timestamp => {
                                var listItem = document.createElement('li');
                                listItem.textContent = timestamp;
                                resultList.appendChild(listItem);
                            });
                        } else {
                            resultList.innerHTML = '<li>No results found.</li>';
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert("An error occurred while fetching data.");
                    });
            });
        });
    </script>
</body>
</html>
